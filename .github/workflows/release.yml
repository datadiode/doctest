name: Bazel Release

on:
  release:
    types: [published]

jobs:
  # Release archives are not stable on GitHub. A stable release archive is
  # recommended for bzlmod consumers.
  # See: https://blog.bazel.build/2023/02/15/github-archive-checksum.html
  release-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - run: python scripts/update_stuff.py ${{ github.repository_owner }}
      - run: python scripts/assemble.py
      - run: tar --exclude='.git' -czf "/tmp/doctest-${GITHUB_REF:10}.tar.gz" *
      - run: gh release upload "${GITHUB_REF:10}" "/tmp/doctest-${GITHUB_REF:10}.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}
